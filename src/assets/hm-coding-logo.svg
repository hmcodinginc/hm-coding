<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="HM Coding">
  <defs>
    <linearGradient id="sphere-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48CFCB"/>
      <stop offset="50%" stop-color="#3E4491"/>
      <stop offset="100%" stop-color="#B33086"/>
    </linearGradient>
    <linearGradient id="text-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48CFCB"/>
      <stop offset="100%" stop-color="#3ab8b4"/>
    </linearGradient>
    <radialGradient id="sphere-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#48CFCB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sphere glow -->
  <ellipse cx="200" cy="130" rx="120" ry="120" fill="url(#sphere-glow)"/>

  <!-- Circuit sphere -->
  <circle cx="200" cy="130" r="90" fill="none" stroke="url(#sphere-cyan)" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="200" cy="130" rx="90" ry="30" fill="none" stroke="#48CFCB" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="200" cy="130" rx="90" ry="55" fill="none" stroke="#B33086" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="200" cy="130" rx="90" ry="75" fill="none" stroke="#3E4491" stroke-width="0.8" opacity="0.5"/>
  <line x1="110" y1="130" x2="290" y2="130" stroke="#48CFCB" stroke-width="0.6" opacity="0.4"/>
  <circle cx="200" cy="100" r="3" fill="#48CFCB"/>
  <circle cx="160" cy="130" r="3" fill="#B33086"/>
  <circle cx="240" cy="130" r="3" fill="#48CFCB"/>
  <circle cx="200" cy="160" r="3" fill="#B33086"/>

  <!-- HM CODING wordmark -->
  <text x="200" y="290" text-anchor="middle" font-family="Orbitron, system-ui, sans-serif" font-size="42" font-weight="800" fill="url(#text-cyan)" letter-spacing="4">HM CODING</text>

  <!-- Since 2026 -->
  <text x="200" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A294C5" letter-spacing="6">SINCE 2026</text>
</svg>
